base_model: Qwen/Qwen2.5-3B-Instruct
dtype: bfloat16
sequence_length: 512
effective_batch_size: 64

watermark:
  type: kgw
  gamma: 0.25
  delta: 2.3
  seeding_scheme: simple_1
  top_k: null

merge_adversary: null

datasets:    [MetaMathQA, AlpacaGPT4Deutsch, FineWeb2DE, AlpacaGPT4, CodeAlpaca, OpenWebText]
proportions: [0.30,       0.20,              0.10,       0.20,       0.10,       0.10]

output_dir: output/watermark/qwen3b_kgwd

training_args:
  per_device_train_batch_size: 8
  learning_rate: 1.0e-5
  max_steps: 5000
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_steps: 500
  bf16: true
  gradient_checkpointing: true
  save_strategy: steps
  save_steps: 1000
  logging_steps: 10
  dataloader_num_workers: 4
  remove_unused_columns: false
  report_to: none
