dataset: NuminaMathCoT
sequence_length: 4096
effective_batch_size: 128

training_args:
  per_device_train_batch_size: 8
  learning_rate: 1.0e-5
  num_train_epochs: 1
  optim: adamw_torch
  weight_decay: 0.01
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  save_strategy: steps
  save_steps: 500
  logging_steps: 10
  dataloader_num_workers: 4
  report_to: none
