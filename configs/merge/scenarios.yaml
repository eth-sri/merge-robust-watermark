inner_alpha: 0.5

variants:
  kgwd:
    watermark_config: configs/watermark/llama8b_kgwd.yaml
    B: output/watermark/llama8b_kgwd/checkpoint-5000
    F_math: output/sft/llama8b_kgwd_math
    F_german: output/sft/llama8b_kgwd_german
    F_french: output/sft/llama8b_kgwd_french
    F_code: output/sft/llama8b_kgwd_code
  mat:
    watermark_config: configs/watermark/llama8b_mat.yaml
    B: output/watermark/llama8b_mat/checkpoint-5000
    F_math: output/sft/llama8b_mat_math
    F_german: output/sft/llama8b_mat_german
    F_french: output/sft/llama8b_mat_french
    F_code: output/sft/llama8b_mat_code
  aar_d:
    watermark_config: configs/watermark/llama8b_aar_d.yaml
    B: output/watermark/llama8b_aar_d/checkpoint-5000
  aar_mat:
    watermark_config: configs/watermark/llama8b_aar_mat.yaml
    B: output/watermark/llama8b_aar_mat/checkpoint-5000
  kth_d:
    watermark_config: configs/watermark/llama8b_kth_d.yaml
    B: output/watermark/llama8b_kth_d/checkpoint-5000
  kth_mat:
    watermark_config: configs/watermark/llama8b_kth_mat.yaml
    B: output/watermark/llama8b_kth_mat/checkpoint-5000
  gaussmark:
    gaussmark_secret: output/watermark/llama8b_gaussmark/gaussmark_secret.pt
    B: output/watermark/llama8b_gaussmark
  qwen3b_kgwd:
    watermark_config: configs/watermark/qwen3b_kgwd.yaml
    B: output/watermark/qwen3b_kgwd/checkpoint-5000
    B_prime: Qwen/Qwen2.5-3B-Instruct
  qwen3b_mat:
    watermark_config: configs/watermark/qwen3b_mat.yaml
    B: output/watermark/qwen3b_mat/checkpoint-5000
    B_prime: Qwen/Qwen2.5-3B-Instruct
  ministral3b_kgwd:
    watermark_config: configs/watermark/ministral3b_kgwd.yaml
    B: output/watermark/ministral3b_kgwd/checkpoint-5000
    B_prime: output/ministral3b_text
  ministral3b_mat:
    watermark_config: configs/watermark/ministral3b_mat.yaml
    B: output/watermark/ministral3b_mat/checkpoint-5000
    B_prime: output/ministral3b_text
  llama1b_ablation:
    watermark_config: configs/watermark/llama1b_ablation.yaml
    B: output/watermark/llama1b_ablation/checkpoint-7500
    B_prime: meta-llama/Llama-3.2-1B-Instruct

unwatermarked:
  B_prime: meta-llama/Llama-3.1-8B-Instruct
  FuseChat: FuseAI/FuseChat-Llama-3.1-8B-SFT
  OpenMath: nvidia/OpenMath2-Llama3.1-8B
  Tulu: allenai/Llama-3.1-Tulu-3-8B

scenarios:
  FF:   {A: F_german, B: F_math}
  BF:   {A: B, B: F_math}
  F2BF: {A: BF, B: FF}
  FBF:  {A: F_german, B: BF}
  F2F:  {A: F_french, B: FF}
  BBp:          {A: B_prime, B: B}
  BFp_FuseChat: {A: FuseChat, B: B, config_source: B, ties_base: B}
  BFp_OpenMath: {A: OpenMath, B: B, config_source: B, ties_base: B}
  BFp_Tulu:     {A: Tulu, B: B, tokenizer_source: B, config_source: B, ties_base: B}
  BF_code:  {A: B, B: F_code}
  FBF_code: {A: F_german, B: BF_code}
  BFp_OpenMath_anchored: {anchor: B_prime, vectors: {B: alpha, OpenMath: 1.0}}

methods:
  linear: {}
  slerp: {}
  ties: {density: 0.5}
  dare_ties: {density: 0.5}
  breadcrumbs: {density: 0.09, gamma: 0.01}
  breadcrumbs_ties: {density: 0.09, gamma: 0.01}
